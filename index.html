<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dde3e6">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Tresor-Hack: Bring den Code in Ordnung</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <style>
    :root {
      --bg: #dde3e6;
      --panel: #eef1f3;
      --ink: #22313a;
      --muted: #5d6d77;
      --line: #b9c4ca;
      --brass: #b4812a;
      --brass-ink: #fff;
      --ok: #237a4f;
      --bad: #b83a2e;
      --code: #1f1f1f;
      --code-ink: #cccccc;
      --syntax-keyword: #c586c0;
      --syntax-number: #b5cea8;
      --syntax-string: #ce9178;
      --syntax-function: #dcdcaa;
      --syntax-boolean: #569cd6;
      --syntax-operator: #d4d4d4;
      --ui: "Barlow Semi Condensed", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #1b252b;
        --panel: #26343c;
        --ink: #e6ecef;
        --muted: #9db0ba;
        --line: #3d4f59;
        --brass: #d9a441;
        --brass-ink: #1b252b;
        --ok: #52c48a;
        --bad: #f0786b;
      }
    }

    :root[data-theme="dark"] {
      --bg: #1b252b;
      --panel: #26343c;
      --ink: #e6ecef;
      --muted: #9db0ba;
      --line: #3d4f59;
      --brass: #d9a441;
      --brass-ink: #1b252b;
      --ok: #52c48a;
      --bad: #f0786b;
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--ui);
      font-size: 20px;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      gap: 20px;
      grid-template-columns: 1.25fr 1fr
    }

    @media (max-width:820px) {
      main {
        grid-template-columns: 1fr
      }
    }

    h1 {
      font-size: 34px;
      line-height: 1.1;
      margin: 0 0 6px;
      font-weight: 700
    }

    .lead {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 20px;
      line-height: 1.35;
      max-width: 46ch
    }

    .panel {
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 18px
    }

    #list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative
    }

    .field {
      position: relative
    }

    #list.locked {
      filter: blur(8px);
      pointer-events: none
    }

    .cover {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 10
    }

    .cover[hidden] {
      display: none
    }

    .cover button {
      min-width: 260px;
      min-height: 80px;
      font-size: 32px
    }

    .blk {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 60px;
      padding: 8px 16px;
      background: var(--code);
      color: var(--code-ink);
      border: 2px solid var(--line);
      border-radius: 10px;
      font-family: var(--mono);
      font-weight: 500;
      font-size: 20px;
      white-space: pre;
      touch-action: none;
      cursor: grab;
      position: relative
    }

    .blk>span:nth-child(2) {
      min-width: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere
    }

    .token.keyword {
      color: var(--syntax-keyword)
    }

    .token.number {
      color: var(--syntax-number)
    }

    .token.boolean {
      color: var(--syntax-boolean)
    }

    .token.operator {
      color: var(--syntax-operator)
    }

    .token.string {
      color: var(--syntax-string)
    }

    .token.builtin,
    .token.function {
      color: var(--syntax-function)
    }

    .blk.run .token {
      color: inherit
    }

    .blk .grip {
      flex: none;
      width: 18px;
      height: 22px;
      opacity: .55;
      background:
        radial-gradient(circle, var(--code-ink) 2px, transparent 2.5px) 0 0/9px 9px
    }

    .blk.dragging {
      z-index: 100;
      cursor: grabbing;
      border-color: var(--brass);
      box-shadow: 0 10px 24px rgba(0, 0, 0, .28);
      transition: none;
      pointer-events: none
    }

    .blk.drop-slot {
      background: var(--panel);
      border: 2px dashed var(--brass);
      box-shadow: none
    }

    .blk.drop-slot>span {
      visibility: hidden
    }

    @media (max-width:600px) {
      .blk {
        font-size: 14px;
        padding: 10px;
        gap: 8px
      }
    }

    .blk.ok {
      border-color: var(--ok)
    }

    .blk.bad {
      border-color: var(--bad)
    }

    .blk.run {
      background: var(--brass);
      color: var(--brass-ink);
      border-color: var(--brass)
    }

    .blk .tag {
      margin-left: auto;
      font-family: var(--ui);
      font-weight: 700;
      font-size: 18px
    }

    .blk.ok .tag {
      color: var(--ok)
    }

    .blk.bad .tag {
      color: var(--bad)
    }

    .bar {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap
    }

    button {
      font: 700 22px var(--ui);
      min-height: 60px;
      padding: 0 26px;
      border-radius: 12px;
      border: 2px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      touch-action: manipulation
    }

    button.main {
      background: var(--brass);
      border-color: var(--brass);
      color: var(--brass-ink);
      flex: 1
    }

    button:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 2px
    }

    button:disabled {
      opacity: .5
    }

    .vault {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px
    }

    .door {
      position: relative;
      width: min(100%, 300px);
      aspect-ratio: 1
    }

    .door svg {
      width: 100%;
      height: 100%
    }

    .ring {
      fill: none;
      stroke: var(--line);
      stroke-width: 10
    }

    .face {
      fill: var(--bg);
      stroke: var(--ink);
      stroke-width: 4
    }

    .handle {
      transform-origin: 150px 150px;
      transition: transform 1.2s ease-in-out;
      stroke: var(--brass);
      stroke-width: 12;
      stroke-linecap: round
    }

    .vault.open .ring {
      stroke: var(--ok)
    }

    .vault.open .handle {
      transform: rotate(360deg);
      stroke: var(--ok)
    }

    .num {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font: 700 64px var(--mono)
    }

    .num small {
      display: block;
      font: 500 18px var(--ui);
      color: var(--muted);
      margin-top: -6px
    }

    #msg {
      font-size: 26px;
      font-weight: 700;
      min-height: 34px
    }

    #msg.good {
      color: var(--ok)
    }

    #msg.warn {
      color: var(--bad)
    }

    .stats {
      display: flex;
      gap: 22px;
      color: var(--muted);
      font-size: 20px
    }

    .stats b {
      color: var(--ink);
      font-family: var(--mono)
    }

    .goal {
      margin: 0;
      color: var(--muted);
      font-size: 19px;
      line-height: 1.35
    }

    @keyframes shake {
      20% {
        transform: translateX(-8px)
      }

      40% {
        transform: translateX(8px)
      }

      60% {
        transform: translateX(-5px)
      }

      80% {
        transform: translateX(5px)
      }
    }

    .shake {
      animation: shake .4s
    }

    @media (prefers-reduced-motion:reduce) {
      .handle {
        transition: none
      }

      .shake {
        animation: none
      }
    }
  </style>
</head>

<body>
  <main>
    <section>
      <h1>Knack den Tresor</h1>
      <p class="lead">Die Code-Zeilen sind durcheinander. Zieh sie an die richtige Stelle. Die Einrückung zeigt, welche
        Zeilen zusammengehören.</p>
      <div class="panel">
        <div class="field">
          <div id="list" aria-label="Code-Zeilen, per Ziehen sortieren"></div>
          <div class="cover" id="cover"><button class="main" id="start">Start</button></div>
        </div>
        <div class="bar">
          <button class="main" id="run">Code ausführen</button>
          <button id="again">Neu mischen</button>
        </div>
      </div>
    </section>
    <section class="panel vault" id="vault">
      <div class="door">
        <svg viewBox="0 0 300 300" aria-hidden="true">
          <circle class="ring" cx="150" cy="150" r="138" />
          <circle class="face" cx="150" cy="150" r="112" />
          <g class="handle">
            <line x1="150" y1="40" x2="150" y2="260" />
            <line x1="40" y1="150" x2="260" y2="150" />
          </g>
          <circle class="face" cx="150" cy="150" r="62" style="fill:var(--panel)" />
        </svg>
        <div class="num">
          <div><span id="en">0</span><small>Energie</small></div>
        </div>
      </div>
      <div id="msg" role="status">Der Tresor öffnet sich bei genau 31 Energie.</div>
      <div class="stats"><span>Zeit <b id="tm">0:00</b></span></div>
      <p class="goal">Tipp: Erst müssen die Variablen existieren, dann kommt die Schleife, am Ende die Prüfung.</p>
    </section>
  </main>
  <script src="./sortable.min.js"></script>
  <script src="./prism-core.min.js" data-manual></script>
  <script src="./prism-python.min.js"></script>
  <script>
    Prism.languages.insertBefore('python', 'keyword', {
      'builtin-function': { pattern: /\bprint(?=\s*\()/, alias: 'builtin' }
    });
    const ZIEL = [
      "energie = 0",
      "pins = [12, 7, 19, 4]",
      "for p in pins:",
      "    if p > 10:",
      "        energie = energie + p",
      "if energie == 31:",
      "    print('TRESOR OFFEN!')"
    ];
    const list = document.getElementById('list'), msg = document.getElementById('msg'),
      en = document.getElementById('en'), vault = document.getElementById('vault'),
      runBtn = document.getElementById('run');
    let t0 = null, timer = null, busy = false, solved = false, started = false;

    function say(t, c) { msg.textContent = t; msg.className = c || '' }
    function order() { return [...list.children].map(e => +e.dataset.k) }
    function build() {
      sortable.option('disabled', true);
      let idx = ZIEL.map((_, i) => i);
      do { for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[idx[i], idx[j]] = [idx[j], idx[i]] } }
      while (isRight(idx));
      list.innerHTML = '';
      idx.forEach(k => {
        const d = document.createElement('div'); d.className = 'blk'; d.dataset.k = k;
        d.innerHTML = '<span class="grip"></span><span></span><span class="tag"></span>';
        d.children[1].innerHTML = Prism.highlight(ZIEL[k], Prism.languages.python, 'python'); list.appendChild(d);
      });
      solved = false; busy = false; started = false; runBtn.disabled = true; list.classList.add('locked'); cover.hidden = false;
      clearInterval(timer); t0 = null;
      document.getElementById('tm').textContent = '0:00';
      en.textContent = 0; vault.classList.remove('open');
      say('Drück auf Start, dann läuft die Zeit.');
    }
    function isRight(o) {
      const a = o.join(), b = ZIEL.map((_, i) => i);
      const alt = b.slice(); alt[0] = 1; alt[1] = 0; // Variablen dürfen vertauscht sein
      return a === b.join() || a === alt.join();
    }
    function startTimer() {
      if (t0) return; t0 = Date.now();
      timer = setInterval(() => {
        const s = Math.floor((Date.now() - t0) / 1000);
        document.getElementById('tm').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0')
      }, 500);
    }
    function clearMarks() { [...list.children].forEach(e => { e.classList.remove('ok', 'bad', 'run'); e.querySelector('.tag').textContent = '' }) }

    const sortable = Sortable.create(list, {
      disabled: true,
      draggable: '.blk',
      animation: matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 160,
      easing: 'cubic-bezier(0.2, 0, 0, 1)',
      forceFallback: true,
      fallbackOnBody: true,
      fallbackTolerance: 4,
      ghostClass: 'drop-slot',
      fallbackClass: 'dragging',
      scrollSensitivity: 70,
      scrollSpeed: 12,
      onChoose: clearMarks,
      onStart() {
        runBtn.disabled = true;
        document.getElementById('again').disabled = true;
      },
      onEnd() {
        runBtn.disabled = !started || busy || solved;
        document.getElementById('again').disabled = false;
      }
    });

    const wait = ms => new Promise(r => setTimeout(r, ms));
    async function run() {
      if (!started || busy || solved) return;
      clearMarks();
      const o = order();
      if (!isRight(o)) {
        let right = 0;
        [...list.children].forEach((e, i) => {
          const k = o[i]; const good = k === i || (i < 2 && k < 2);
          e.classList.add(good ? 'ok' : 'bad'); e.querySelector('.tag').textContent = good ? 'passt' : 'falsch';
          if (good) right++;
        });
        say(right + ' von 7 Zeilen sitzen. Der Tresor bleibt zu.', 'warn');
        list.classList.remove('shake'); void list.offsetWidth; list.classList.add('shake');
        return;
      }
      busy = true; runBtn.disabled = true; sortable.option('disabled', true); clearInterval(timer);
      say('Code läuft …');
      const rows = [...list.children];
      let energie = 0; const pins = [12, 7, 19, 4];
      const hi = async i => { rows[i].classList.add('run'); await wait(450); rows[i].classList.remove('run') };
      const base = rows.length - 5; // Zeilenindex nach Variablen-Block
      await hi(0); await hi(1);
      await hi(2);
      for (const p of pins) {
        await hi(3);
        if (p > 10) { await hi(4); energie += p; en.textContent = energie }
      }
      await hi(5);
      if (energie === 31) {
        rows[6].classList.add('ok'); await hi(6); rows.forEach(r => r.classList.add('ok'));
        vault.classList.add('open'); say('TRESOR OFFEN!', 'good');
        const s = Math.floor((Date.now() - t0) / 1000);
        document.getElementById('tm').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
      }
      solved = true; busy = false;
      setTimeout(() => { if (solved) build() }, 45000); // Messe: automatisch neue Runde
    }
    const cover = document.getElementById('cover');
    document.getElementById('start').addEventListener('click', () => {
      started = true; cover.hidden = true; list.classList.remove('locked'); runBtn.disabled = false;
      sortable.option('disabled', false);
      say('Der Tresor öffnet sich bei genau 31 Energie.'); startTimer();
    });
    runBtn.addEventListener('click', run);
    document.getElementById('again').addEventListener('click', build);
    build();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(error => {
          console.error('Service worker registration failed:', error);
        });
      });
    }
  </script>
</body>

</html>
